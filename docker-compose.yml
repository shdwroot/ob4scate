x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - path: .env
      required: false
  restart: unless-stopped

x-healthcheck: &http-healthcheck
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 20s

services:
  gateway_proxy:
    <<: *app
    command: ["uvicorn", "gateway_proxy.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APP_ENV: production
      SESSION_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      DB_HOST: tokenization_vault_db
      DB_PORT: "5432"
      DB_USER: vault_user
      DB_PASS: ${DB_PASS:?Set DB_PASS in .env}
      DB_NAME: vault_db
      LITELLM_BASE_URL: http://ollama:11434
      AUDIT_LOG_DB: /app/data/audit_logs.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - audit_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      tokenization_vault_db:
        condition: service_healthy
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]

  obfuscation_engine:
    <<: *app
    command: ["uvicorn", "obfuscation_engine.main:app", "--host", "0.0.0.0", "--port", "8001"]
    expose: ["8001"]
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]

  tokenization_vault:
    <<: *app
    command: ["uvicorn", "tokenization_vault.main:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      DB_HOST: tokenization_vault_db
      DB_PORT: "5432"
      DB_USER: vault_user
      DB_PASS: ${DB_PASS:?Set DB_PASS in .env}
      DB_NAME: vault_db
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:?Set VAULT_ENCRYPTION_KEY in .env}
    expose: ["8002"]
    depends_on:
      tokenization_vault_db:
        condition: service_healthy
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=2)"]

  tokenization_vault_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vault_user
      POSTGRES_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
      POSTGRES_DB: vault_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./tokenization_vault/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault_user -d vault_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  litellm_integration:
    <<: *app
    command: ["uvicorn", "litellm_integration.main:app", "--host", "0.0.0.0", "--port", "8003"]
    environment:
      LITELLM_BASE_URL: http://ollama:11434
    expose: ["8003"]
    depends_on:
      - ollama
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=2)"]

  policy_engine:
    <<: *app
    command: ["uvicorn", "policy_engine.main:app", "--host", "0.0.0.0", "--port", "8004"]
    expose: ["8004"]
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=2)"]

  audit_logging:
    <<: *app
    command: ["uvicorn", "audit_logging.main:app", "--host", "0.0.0.0", "--port", "8005"]
    environment:
      AUDIT_LOG_DB: /app/data/audit_logs.db
      AUDIT_LOG_SIGNING_KEY: ${AUDIT_LOG_SIGNING_KEY:?Set AUDIT_LOG_SIGNING_KEY in .env}
    expose: ["8005"]
    volumes:
      - audit_data:/app/data
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health', timeout=2)"]

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    expose: ["11434"]
    volumes:
      - ollama_data:/root/.ollama

volumes:
  audit_data:
  ollama_data:
  postgres_data:
  redis_data:
