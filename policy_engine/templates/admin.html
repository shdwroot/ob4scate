<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Policy Engine Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Local Black Dashboard CSS -->
  <link rel="stylesheet" href="./static/assets/css/black-dashboard.min.css">
  <link rel="stylesheet" href="./static/assets/css/nucleo-icons.css">
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700,200" rel="stylesheet">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.1/css/all.css">
</head>
<body class="sidebar-mini">
  <div class="wrapper">
    <!-- Sidebar -->
    <div class="sidebar" data-color="blue">
      <div class="sidebar-wrapper">
        <div class="logo">
          <a href="#" class="simple-text logo-mini">
            <i class="fas fa-shield-alt"></i>
          </a>
          <a href="#" class="simple-text logo-normal">
            Policy Engine
          </a>
        </div>
        <ul class="nav">
          <li class="active">
            <a href="./admin">
              <i class="fas fa-cogs"></i>
              <p>Admin Panel</p>
            </a>
          </li>
          <li>
            <a href="./rules">
              <i class="fas fa-database"></i>
              <p>API Rules</p>
            </a>
          </li>
        </ul>
      </div>
    </div>

    <!-- Main Panel -->
    <div class="main-panel">
      <!-- Navbar -->
      <nav class="navbar navbar-expand-lg navbar-absolute navbar-transparent">
        <div class="container-fluid">
          <div class="navbar-wrapper">
            <a class="navbar-brand" href="#">Policy Engine Admin</a>
          </div>
        </div>
      </nav>

      <!-- Content -->
      <div class="content">
        <div class="row">
          <div class="col-md-12">
            <div class="card">
              <div class="card-header">
                <h4 class="card-title">Current Policy Rules</h4>
              </div>
              <div class="card-body">
                <form id="policy-form">
                  <div id="rules-container" class="mb-3">
                    <!-- Rules loaded dynamically -->
                  </div>
                  <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <footer class="footer">
        <div class="container-fluid">
          <nav>
            <ul>
              <li>
                <a href="https://www.creative-tim.com/product/black-dashboard">
                  Black Dashboard Theme
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </footer>
    </div>
  </div>

  <!-- Local JS -->
  <script src="./static/assets/js/core/jquery.min.js"></script>
  <script src="./static/assets/js/core/popper.min.js"></script>
  <script src="./static/assets/js/core/bootstrap.min.js"></script>
  <script src="./static/assets/js/plugins/perfect-scrollbar.jquery.min.js"></script>
  <script src="./static/assets/js/black-dashboard.min.js"></script>
  <script>
    function addField(container, key, value) {
      const wrapper = document.createElement('div');
      wrapper.className = typeof value === 'boolean' ? 'form-check' : 'form-group';

      const label = document.createElement('label');
      label.textContent = key;

      let input;
      if (Array.isArray(value)) {
        input = document.createElement('textarea');
        input.className = 'form-control';
        input.rows = 8;
        input.value = JSON.stringify(value, null, 2);
      } else if (typeof value === 'boolean') {
        input = document.createElement('input');
        input.className = 'form-check-input';
        input.type = 'checkbox';
        input.checked = value;
        input.id = `rule-${key}`;
        label.className = 'form-check-label';
        label.htmlFor = input.id;
      } else {
        input = document.createElement('input');
        input.className = 'form-control';
        input.type = 'text';
        input.value = String(value);
      }

      input.dataset.key = key;
      wrapper.append(input, label);
      container.appendChild(wrapper);
    }

    async function loadRules() {
      const res = await fetch('./rules', { credentials: 'same-origin' });
      if (!res.ok) throw new Error(`Unable to load rules (${res.status})`);
      const rules = await res.json();
      const container = document.getElementById('rules-container');
      container.replaceChildren();
      Object.entries(rules).forEach(([key, value]) => addField(container, key, value));
    }

    document.getElementById('policy-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const inputs = document.querySelectorAll('#rules-container [data-key]');
      const updatedRules = {};
      inputs.forEach(input => {
        const key = input.getAttribute('data-key');
        if (input.type === 'checkbox') {
          updatedRules[key] = input.checked;
        } else {
          try {
            updatedRules[key] = JSON.parse(input.value);
          } catch {
            updatedRules[key] = input.value;
          }
        }
      });
      const response = await fetch('./rules', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(updatedRules)
      });
      if (!response.ok) {
        alert(`Unable to update rules (${response.status})`);
        return;
      }
      alert('Rules updated successfully');
      loadRules();
    });

    loadRules().catch(() => alert('Unable to load policy rules'));
  </script>
</body>
</html>
